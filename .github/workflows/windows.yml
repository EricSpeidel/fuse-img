name: Build Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check blend math and transparency
        run: dotnet run --project tests/Fuse.Checks -c Release
      - name: Check Windows rendering and export
        run: dotnet run --project tests/Fuse.WindowsChecks -c Release
      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/Fuse.App/Fuse.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          -p:DebugSymbols=false -o artifacts/Fuse-win-x64
      - name: Include quick-start instructions
        shell: pwsh
        run: Copy-Item README.md artifacts/Fuse-win-x64/README.md
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: Fuse-Windows-x64
          path: artifacts/Fuse-win-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Upload UI smoke image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fuse-UI-smoke
          path: artifacts/ui-smoke.png
          if-no-files-found: ignore

  release:
    name: Release Windows app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested Windows app
        uses: actions/download-artifact@v4
        with:
          name: Fuse-Windows-x64
          path: release/Fuse-Windows-x64
      - name: Package Windows download
        shell: pwsh
        run: Compress-Archive -Path release/Fuse-Windows-x64/* -DestinationPath release/Fuse-Windows-x64.zip
      - name: Publish release for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "build-$env:GITHUB_SHA"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; nothing to publish."
            exit 0
          }
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          gh release create $tag release/Fuse-Windows-x64.zip --target $env:GITHUB_SHA --title "Fuse build $env:GITHUB_RUN_NUMBER ($shortSha)" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
